<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GradúaClick</title>
<link rel="stylesheet" href="CSS/prototipo.css">
</head>
<body>
<div class="form-tramite">
  <div class="form-header">
    <div>
      <div class="form-title">Recepción de documentos para trámite de titulación Prototipo</div>
      <div>Oficina de Titulación</div>
    </div>
  </div>

  <form id="formTitulacion" autocomplete="off">
    <div class="form-section-title">Datos personales</div>

    <div class="form-group"><label for="fecha">Fecha:</label>
      <input type="date" id="fecha" name="fecha" required readonly></div>

    <div class="form-group"><label for="turno">Turno:</label>
      <select id="turno" name="turno" required>
        <option value="">Seleccione turno</option><option>Matutino</option><option>Vespertino</option>
      </select></div>

    <div class="form-group"><label for="grupo">Grupo:</label>
      <select id="grupo" name="grupo" required>
        <option value="">Seleccione grupo</option><option>6-A</option><option>6-B</option>
      </select></div>

    <div class="form-group"><label for="primer_apellido">Apellido paterno:</label>
      <input type="text" id="primer_apellido" name="primer_apellido" required placeholder="Apellido paterno"></div>

    <div class="form-group"><label for="segundo_apellido">Apellido materno:</label>
      <input type="text" id="segundo_apellido" name="segundo_apellido" required placeholder="Apellido materno"></div>

    <div class="form-group"><label for="nombre">Nombre(s):</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Nombre(s)"></div>

    <div class="form-group"><label for="especialidad">Especialidad:</label>
      <select id="especialidad" name="especialidad" required>
        <option value="">Seleccione una opción</option>
        <option value="programación">Programación</option>
        <option value="puericultura">Puericultura</option>
        <option value="servicios de hospedaje">Servicios de Hospedaje</option>
        <option value="ofimática">Ofimática</option>
        <option value="soporte y mantenimiento">Soporte y Mantenimiento</option>
        <option value="contabilidad">Contabilidad</option>
        <option value="ventas">Ventas</option>
        <option value="administración de recursos humanos">Administración de Recursos Humanos</option>
        <option value="electrónica">Electrónica</option>
      </select></div>

    <div class="form-group"><label for="no_de_control">No. de Control:</label>
      <input type="text" id="no_de_control" name="no_de_control" required placeholder="Ejemplo: 22316061200697"></div>

    <div class="form-group"><label for="fecha_nacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required></div>

    <div class="form-group"><label for="nacionalidad">Nacionalidad:</label>
      <select id="nacionalidad" name="nacionalidad" required>
        <option value="">Seleccione nacionalidad</option><option>Mexicana</option><option>Otra</option>
      </select></div>

    <div class="form-group"><label for="estado_nacimiento">Estado de Nacimiento:</label>
      <select id="estado_nacimiento" name="estado_nacimiento" required>
        <option value="">Seleccione estado</option>
        <option>Aguascalientes</option><option>Baja California</option><option>Baja California Sur</option>
        <option>Campeche</option><option>Chiapas</option><option>Chihuahua</option>
        <option>Ciudad de México</option><option>Coahuila</option><option>Colima</option>
        <option>Durango</option><option>Estado de México</option><option>Guanajuato</option>
        <option>Guerrero</option><option>Hidalgo</option><option>Jalisco</option>
        <option>Michoacán</option><option>Morelos</option><option>Nayarit</option>
        <option>Nuevo León</option><option>Oaxaca</option><option>Puebla</option>
        <option>Querétaro</option><option>Quintana Roo</option><option>San Luis Potosí</option>
        <option>Sinaloa</option><option>Sonora</option><option>Tabasco</option>
        <option>Tamaulipas</option><option>Tlaxcala</option><option>Veracruz</option>
        <option>Yucatán</option><option>Zacatecas</option><option>Otra</option>
      </select></div>

    <div class="form-group"><label for="municipio_nacimiento">Municipio:</label>
      <select id="municipio_nacimiento" name="municipio_nacimiento" required>
        <option value="">Seleccione municipio</option>
        <option>Acapulco</option><option>Aguascalientes</option><option>Apodaca</option>
        <option>Campeche</option><option>Cancún</option><option>Celaya</option>
        <option>Chihuahua</option><option>Ciudad de México</option><option>Ciudad Juárez</option>
        <option>Coyoacán</option><option>Cuernavaca</option><option>Culiacán</option>
        <option>Durango</option><option>Ecatepec</option><option>Ensenada</option>
        <option>Guadalajara</option><option>Hermosillo</option><option>Irapuato</option>
        <option>León</option><option>Mérida</option><option>Mexicali</option>
        <option>Monterrey</option><option>Morelia</option><option>Naucalpan</option>
        <option>Nezahualcóyotl</option><option>Oaxaca</option><option>Pachuca</option>
        <option>Puebla</option><option>Querétaro</option><option>Saltillo</option>
        <option>San Luis Potosí</option><option>Tijuana</option><option>Toluca</option>
        <option>Torreón</option><option>Tuxtla Gutiérrez</option><option>Veracruz</option>
        <option>Villahermosa</option><option>Xalapa</option><option>Zapopan</option><option>Otra</option>
      </select></div>

    <div class="form-group"><label for="no_de_celular">No. de Celular:</label>
      <input type="tel" id="no_de_celular" name="no_de_celular" required pattern="[0-9]{10}" placeholder="10 dígitos"></div>

    <div class="form-group"><label for="no_de_tel_adicional">No. de Tel. Adicional:</label>
      <input type="tel" id="no_de_tel_adicional" name="no_de_tel_adicional" pattern="[0-9]{10}" placeholder="10 dígitos (opcional)"></div>

    <div class="form-group"><label for="correo_electronico">Correo Electrónico:</label>
      <input type="email" id="correo_electronico" name="correo_electronico" required placeholder="ejemplo@correo.com"></div>

    <div class="form-section-title">Documentos a entregar</div>
    <div class="doc-list">
      <div class="doc-item"><input type="checkbox" id="actaNacimiento" name="actaNacimiento" required><label for="actaNacimiento">Acta de Nacimiento</label><input type="file" id="fileActaNacimiento" name="fileActaNacimiento" accept=".pdf,.jpg,.png" required></div>
      <div class="doc-item"><input type="checkbox" id="curpDoc" name="curpDoc" required><label for="curpDoc">CURP</label><input type="file" id="fileCurp" name="fileCurp" accept=".pdf,.jpg,.png" required></div>
      <div class="doc-item"><input type="checkbox" id="certificadoSecundaria" name="certificadoSecundaria" required><label for="certificadoSecundaria">Certificado de Secundaria</label><input type="file" id="fileCertificadoSecundaria" name="fileCertificadoSecundaria" accept=".pdf,.jpg,.png" required></div>
      <div class="doc-item"><input type="checkbox" id="certificadoBachillerato" name="certificadoBachillerato" required><label for="certificadoBachillerato">Certificado de Bachillerato</label><input type="file" id="fileCertificadoBachillerato" name="fileCertificadoBachillerato" accept=".pdf,.jpg,.png" required></div>
      <div class="doc-item"><input type="checkbox" id="cartaLiberacionSS" name="cartaLiberacionSS" required><label for="cartaLiberacionSS">Carta de Liberación de Servicio Social</label><input type="file" id="fileCartaLiberacionSS" name="fileCartaLiberacionSS" accept=".pdf,.jpg,.png" required></div>
      <div class="doc-item"><input type="checkbox" id="cartaLiberacionPracticas" name="cartaLiberacionPracticas" required><label for="cartaLiberacionPracticas">Carta de Liberación de Prácticas Profesionales</label><input type="file" id="fileCartaLiberacionPracticas" name="fileCartaLiberacionPracticas" accept=".pdf,.jpg,.png" required></div>
      <div class="doc-item"><input type="checkbox" id="pagoBancomer" name="pagoBancomer" required><label for="pagoBancomer">Pago generado en BBVA (original y dos copias)</label><input type="file" id="filePagoBancomer" name="filePagoBancomer" accept=".pdf,.jpg,.png" required></div>
    </div>

    <div class="botones">
      <button type="submit" class="botoncomenzar">Enviar</button>
      <a href="#" class="botondocumentacion" id="verificarBtn">Verificar</a>
    </div>

    <input type="hidden" name="tipo_titulacion" value="prototipo">
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded',function(){
  const f=document.getElementById('fecha');
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  if(f) f.value=`${y}-${m}-${day}`;
});
</script>
</body>
</html>
